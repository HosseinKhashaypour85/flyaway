name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --${{ github.event.inputs.build_type }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk-${{ github.event.inputs.build_type }}
        path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk

    - name: Create download link
      run: |
        echo "## 📱 Flutter APK Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**Download APK:** [flutter-apk-${{ github.event.inputs.build_type }}.apk](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY