name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --${{ github.event.inputs.build_type }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk-${{ github.event.inputs.build_type }}
        path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: apk-${{ github.event.inputs.build_type }}-${{ github.run_number }}
        name: APK Build ${{ github.event.inputs.build_type }} #${{ github.run_number }}
        body: |
          🚀 **Flutter APK Build**

          **Build Type:** ${{ github.event.inputs.build_type }}
          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}

          📥 **Download APK:** [app-${{ github.event.inputs.build_type }}.apk](https://github.com/${{ github.repository }}/releases/download/apk-${{ github.event.inputs.build_type }}-${{ github.run_number }}/app-${{ github.event.inputs.build_type }}.apk)
        files: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
        draft: false
        prerelease: ${{ github.event.inputs.build_type == 'debug' }}

    - name: Create download link summary
      run: |
        echo "## 📱 Flutter APK Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**Download APK:** [app-${{ github.event.inputs.build_type }}.apk](https://github.com/${{ github.repository }}/releases/download/apk-${{ github.event.inputs.build_type }}-${{ github.run_number }}/app-${{ github.event.inputs.build_type }}.apk)" >> $GITHUB_STEP_SUMMARY